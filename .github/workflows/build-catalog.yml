# Rebuilds catalog.json and addons.xml.md5 whenever a local addons.xml (or a repository add-on) changes.
# Layout: .github/workflows/build-catalog.yml (this file), .github/scripts/build_catalog.py, catalog.json in the repository root.
name: Build catalog

on:
  push:
    branches: [master]
    paths:
      - "addons.xml"
      - "misc/addons.xml"
      - "repo/addons.xml"
      - "repos/addons.xml"
      - "repo/repository.*/**"
      - ".github/scripts/build_catalog.py"
      - ".github/workflows/build-catalog.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"      # daily at 04:17 UTC: refresh versions and dates of external add-ons

permissions:
  contents: write

concurrency:
  group: build-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history is needed for add-on dates)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/build_catalog.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json '*.md5'
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update catalog [skip ci]"
            git push
          fi
