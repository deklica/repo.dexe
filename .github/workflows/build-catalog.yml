# Rebuilds catalog.json, catalog/<repository>.json and addons.xml.md5 whenever a local addons.xml (or a repository add-on) changes.
# Layout: .github/workflows/build-catalog.yml (this file), .github/scripts/build_catalog.py, catalog.json in the repository root.
name: Build catalog

on:
  push:
    branches: [master]
    paths:
      - "addons.xml"
      - "misc/addons.xml"
      - "repo/addons.xml"
      - "repos/addons.xml"
      - "repo/repository.*/**"
      - "repos/repository.*/**"
      - ".github/scripts/build_catalog.py"
      - ".github/workflows/build-catalog.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"      # daily at 02:17 UTC = 04:17 Belgrade in summer, 03:17 in winter (GitHub cron is UTC only)

permissions:
  contents: write

concurrency:
  group: build-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history is needed for add-on dates)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Own commits (push): only the local sources are rebuilt, nothing is downloaded.
      # The daily schedule (and a manual run) also refreshes the external add-ons and the third-party repositories.
      - name: Build catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/build_catalog.py ${{ github.event_name == 'push' && '--no-remote' || '' }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f catalog.json catalog 2>/dev/null || true     # -f: listed in .gitignore so that local runs stay invisible to git
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
          else
            git commit -m "Update catalog [skip ci]"
          fi
          git add -f '*.md5' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "md5 unchanged"
          else
            git commit -m "Update md5 [skip ci]"
          fi
          if [ "$(git rev-list --count origin/master..HEAD)" -gt 0 ]; then
            git push
          else
            echo "Nothing to push"
          fi
